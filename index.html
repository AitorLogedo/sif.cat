    --border: #e4e1ee;
    --accent: #7c5cff;

  @media (prefers-color-scheme: dark) {
    :root {

      --muted: #9a97ab;
      --card: #1c1b25;
      --border: #2c2a38;
      --accent: #a28bff;

  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }
  main {
    width: 100%;
    max-width: 360px;
    text-align: center;
  }
  .avatar {
    width: 88px;
    height: 88px;
    margin: 0 auto 20px;
    border-radius: 24px;
    background: #7c5cff;
    color: #fff;
    display: grid;
    place-items: center;
    font: 700 44px/1 Georgia, "Times New Roman", serif;
  }
  h1 {
    margin: 0 0 32px;
    font-size: 32px;
    letter-spacing: -0.02em;
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 12px;
  }
  a {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--card);
    color: var(--fg);
    text-decoration: none;
    transition: border-color .15s, transform .15s;
  }
  a:hover, a:focus-visible {
    border-color: var(--accent);
    transform: translateY(-1px);
    outline: none;
  }
  a svg { width: 22px; height: 22px; flex: none; fill: currentColor; }
  a .label { font-weight: 600; }
  a .handle { margin-left: auto; color: var(--muted); font-size: 14px; }
